<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ prenom }} {{ nom }} - CV Minimal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; }
        .cv { max-width: 900px; margin: 0 auto; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 300; letter-spacing: 3px; color: #111; }
        .header .job { font-size: 18px; font-weight: 300; color: #666; margin-top: 5px; letter-spacing: 1px; }
        .divider { width: 60px; height: 2px; background: #111; margin: 15px 0; }
        .section { margin-bottom: 35px; }
        .section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #888; font-weight: 400; margin-bottom: 12px; }
        .section p { font-size: 15px; line-height: 1.8; color: #333; font-weight: 300; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 10px; }
        .exp-item, .form-item { margin-bottom: 20px; }
        .exp-title { font-weight: 500; font-size: 16px; color: #111; }
        .exp-company { color: #555; font-weight: 300; }
        .exp-date { color: #999; font-size: 13px; margin-top: 2px; }
        .exp-description { font-size: 14px; line-height: 1.7; color: #555; margin-top: 5px; font-weight: 300; }
        .exp-location, .form-location { color: #999; font-size: 13px; }
        .mention { color: #2d6a4f; font-weight: 400; font-size: 13px; }
        .contact-item { margin: 4px 0; font-size: 14px; color: #555; font-weight: 300; }
        .competence-tag { display: inline-block; background: #f5f5f5; padding: 3px 12px; margin: 2px 4px 2px 0; font-size: 13px; color: #333; font-weight: 300; }
        .langue-item { display: flex; justify-content: space-between; padding: 3px 0; font-weight: 300; }
        .langue-name { color: #111; }
        .langue-level { color: #999; }
        .right ul { list-style: none; padding: 0; }
        .right ul li { padding: 3px 0; font-size: 14px; color: #555; font-weight: 300; }
        .right ul li::before { content: "— "; color: #ccc; }
        .photo { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; gap: 30px; } body { padding: 20px; } }
        @media print { body { padding: 0; } }
    </style>
</head>
<body>
<div class="cv">
    <div class="header">
        {% if photo %}<img class="photo" src="{{ photo }}" alt="Photo">{% endif %}
        <h1>{% if civilite %}{{ civilite }} {% endif %}{{ prenom
