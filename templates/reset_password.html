<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nouveau mot de passe — CVPro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body data-connecte="false">

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo">CV<span>Pro</span></a>
    <nav class="menu">
      <a href="/">Accueil</a>
      <a href="/login">Connexion</a>
    </nav>
  </div>
</header>

<main class="contenu" style="padding: 60px 0;">
  <div class="form-auth">
    <div style="text-align:center; margin-bottom:20px;">
      <div style="font-size:3rem; margin-bottom:8px;">🔑</div>
    </div>

    <h1>Nouveau mot de passe</h1>
    <p class="sous-titre">
      Choisissez un nouveau mot de passe sécurisé pour <b>{{ email }}</b>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="formulaire">
      <label>Nouveau mot de passe *
        <input type="password" name="password" minlength="6"
               placeholder="6 caractères minimum" required autofocus/>
      </label>

      <label>Confirmer le mot de passe *
        <input type="password" name="password2" minlength="6"
               placeholder="Répétez le mot de passe" required/>
      </label>

      <button type="submit" class="btn-or btn-grand">
        ✅ Enregistrer le nouveau mot de passe
      </button>
    </form>

    <p class="lien-bas">
      <a href="/login">← Retour à la connexion</a>
    </p>
  </div>
</main>

</body>
</html>
