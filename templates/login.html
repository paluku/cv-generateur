<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Connexion — CVPro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo">CV<span>Pro</span></a>
    <nav class="menu">
      <a href="/">Accueil</a>
      <a href="/register">Inscription</a>
    </nav>
  </div>
</header>

<main class="contenu" style="padding: 60px 0;">
  <div class="form-auth">
    <h1>Connexion</h1>
    <p class="sous-titre">Retrouvez vos CV et votre Premium</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="formulaire">
      <label>Email
        <input type="email" name="email" required autofocus/>
      </label>
      <label>Mot de passe
        <input type="password" name="password" required/>
      </label>

      <button type="submit" class="btn-or btn-grand">Se connecter</button>
    </form>
    <p class="lien-bas" style="margin-bottom: 8px;">
      <a href="/mot-de-passe-oublie" style="color: #64748b; font-size: .9rem;">
        🔐 Mot de passe oublié ?
      </a>
    </p>
    <p class="lien-bas">
      Pas encore de compte ? <a href="/register">Inscrivez-vous</a>
    </p>
  </div>
</main>

</body>
</html>
